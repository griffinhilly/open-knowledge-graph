name: Deploy Visualizations to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate graph
        run: python tools/validate.py

      - name: Generate index page
        run: python tools/visualize_hierarchy.py --index-only

      - name: Generate radial visualization
        run: python tools/visualize_radial.py

      - name: Generate topic detail pages
        run: python tools/generate_topic_pages.py

      - name: Generate domain maps
        run: python tools/visualize_domain_map.py --all

      - name: Generate assessment data
        run: python tools/generate_assessment.py

      - name: Generate assessment page
        run: python tools/generate_assessment_page.py

      - name: Generate quiz question bank
        run: python tools/generate_assessment_questions.py

      - name: Generate quiz page
        run: python tools/generate_quiz_page.py

      - name: Generate domain question banks
        run: python tools/generate_domain_questions.py

      - name: Generate domain quiz page
        run: python tools/generate_domain_quiz.py

      - name: Generate sitemap and robots.txt
        run: python tools/generate_sitemap.py

      - name: Validate SEO surface (full corpus)
        run: python tools/validate_seo.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
